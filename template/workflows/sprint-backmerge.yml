# Keeps the base branch current with what shipped.
#
# In a branch-per-environment model, anything applied downstream -- a hotfix on
# UAT, a fix made during release hardening -- exists only on that branch. Unless
# it flows back, the next sprint is cut from a base branch that silently lacks
# it, and the fix is reverted in production. This workflow is the mitigation:
# it opens a pull request whenever UAT or a release branch is ahead of base.
name: Sprint - back-merge to base

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sprint-backmerge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backmerge:
    runs-on: ${{ vars.SPRINT_RUNNER || 'self-hosted' }}
    # Every run: block below is bash. A Windows self-hosted runner defaults to
    # PowerShell, which parses `set -euo pipefail` as a command name and fails
    # the step outright, so the shell is pinned rather than inherited.
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: scripts
      GH_TOKEN: ${{ secrets.SPRINT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On a self-hosted runner this may be unable to fetch a toolchain; the
      # preflight below confirms a usable Python either way.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt || echo "::warning::pip install failed; falling back to packages already on the runner"

      - name: Preflight - check the runner has what this needs
        run: |
          set -euo pipefail
          missing=0
          command -v git >/dev/null 2>&1 || { echo "::error::git is not on this runner"; missing=1; }
          command -v gh  >/dev/null 2>&1 || { echo "::error::the GitHub CLI (gh) is not on this runner. Install it, or set SPRINT_RUNNER to a runner that has it."; missing=1; }
          python3 -c "import yaml" 2>/dev/null || { echo "::error::PyYAML is not importable. Pre-install it on the runner if this network cannot reach PyPI."; missing=1; }
          python3 -c "from zoneinfo import ZoneInfo; ZoneInfo('UTC')" 2>/dev/null || { echo "::error::No timezone database on this runner. Windows ships none; pre-install it with: pip install tzdata"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "runner ok: $(git --version), $(gh --version | head -1), $(python3 --version)"

      - name: Resolve configuration
        id: sprint
        run: python -m sprint status

      - name: Open back-merge pull requests
        if: steps.sprint.outputs.backmerge_to_base == 'true'
        env:
          BASE: ${{ steps.sprint.outputs.base_branch }}
          UAT: ${{ steps.sprint.outputs.uat_branch }}
          LABELS: ${{ steps.sprint.outputs.labels }}
        run: |
          set -euo pipefail

          git fetch --quiet origin

          if ! git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            echo "::error::base branch '$BASE' does not exist"
            exit 1
          fi

          # UAT plus any release branch, since release hardening lands there too.
          candidates=$(git ls-remote --heads origin "$UAT" 'refs/heads/release/*' \
            | sed 's|.*refs/heads/||' | sort -u)

          opened=0
          for branch in $candidates; do
            ahead=$(git rev-list --count "origin/$BASE..origin/$branch" 2>/dev/null || echo 0)
            if [ "$ahead" -eq 0 ]; then
              continue
            fi

            existing=$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "::notice::Back-merge PR #$existing already open for $branch"
              continue
            fi

            body=$(printf '%s\n' \
              "\`$branch\` is **$ahead commit(s)** ahead of \`$BASE\`." \
              "" \
              "Those commits exist only downstream. Until this merges, the next sprint" \
              "branch will be cut without them and the change will be lost." \
              "" \
              "<sub>Opened by sprint-automation.</sub>")

            args=(--head "$branch" --base "$BASE" --title "Back-merge $branch into $BASE" --body "$body")
            IFS=',' read -ra labels <<< "$LABELS"
            for label in "${labels[@]}"; do
              [ -z "$label" ] && continue
              gh label create "$label" --color ededed --description 'Opened by sprint automation' >/dev/null 2>&1 || true
              args+=(--label "$label")
            done

            url=$(gh pr create "${args[@]}")
            echo "::notice::Opened back-merge $url"
            echo "- $branch -> $BASE ($ahead commits): $url" >> "$GITHUB_STEP_SUMMARY"
            opened=$((opened + 1))
          done

          if [ "$opened" -eq 0 ]; then
            echo "::notice::No drift - $BASE is current with UAT and all release branches"
          fi
