# Cuts the sprint branch from the base branch on the first day of each sprint.
# Runs daily and self-gates: on 13 of every 14 days (default cadence) it exits
# without doing anything.
name: Sprint - cut branch

on:
  schedule:
    # Early enough that the branch exists before the team starts work.
    # Boundaries are evaluated in cadence.timezone, not in this cron's UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Evaluate a specific date (YYYY-MM-DD) instead of today'
        required: false
        type: string
      force:
        description: 'Cut even if the date is not a sprint start'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sprint-cut-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ${{ vars.SPRINT_RUNNER || 'self-hosted' }}
    # Every run: block below is bash. A Windows self-hosted runner defaults to
    # PowerShell, which parses `set -euo pipefail` as a command name and fails
    # the step outright, so the shell is pinned rather than inherited.
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On a self-hosted runner this may be unable to fetch a toolchain; the
      # preflight below confirms a usable Python either way.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt || echo "::warning::pip install failed; falling back to packages already on the runner"

      - name: Preflight - check the runner has what this needs
        run: |
          set -euo pipefail
          missing=0
          command -v git >/dev/null 2>&1 || { echo "::error::git is not on this runner"; missing=1; }
          python3 -c "import yaml" 2>/dev/null || { echo "::error::PyYAML is not importable. Pre-install it on the runner if this network cannot reach PyPI."; missing=1; }
          python3 -c "from zoneinfo import ZoneInfo; ZoneInfo('UTC')" 2>/dev/null || { echo "::error::No timezone database on this runner. Windows ships none; pre-install it with: pip install tzdata"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "runner ok: $(git --version), $(python3 --version)"

      - name: Resolve sprint
        id: sprint
        env:
          DATE_OVERRIDE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${DATE_OVERRIDE:-}" ]; then
            python -m sprint status --date "$DATE_OVERRIDE"
          else
            python -m sprint status
          fi

      - name: Cut sprint branch
        if: steps.sprint.outputs.is_sprint_start == 'true' || inputs.force
        env:
          BRANCH: ${{ steps.sprint.outputs.sprint_branch }}
          BASE: ${{ steps.sprint.outputs.base_branch }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already exists - nothing to do"
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            echo "::error::base branch '$BASE' does not exist. Create it, or correct branches.base in .github/sprint.yml"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BASE"
          git branch "$BRANCH" "origin/$BASE"
          git push origin "$BRANCH"

          echo "::notice::Cut $BRANCH from $BASE"
          {
            echo "### Sprint branch cut"
            echo ""
            echo "\`$BRANCH\` created from \`$BASE\`."
            echo ""
            echo "- Sprint window: ${{ steps.sprint.outputs.sprint_start }} to ${{ steps.sprint.outputs.sprint_end }}"
            echo "- Point feature pull requests at \`$BRANCH\` for this sprint."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a no-op day
        if: steps.sprint.outputs.is_sprint_start != 'true' && !inputs.force
        run: |
          echo "::notice::Not a sprint start. Current sprint ${{ steps.sprint.outputs.sprint_branch }} runs ${{ steps.sprint.outputs.sprint_start }} to ${{ steps.sprint.outputs.sprint_end }}."
