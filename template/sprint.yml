# Sprint automation configuration.
#
# This is the only file a team needs to edit. Copy it into your repo alongside
# the sprint-*.yml workflows and set the cadence to match how your team works.
version: 1

cadence:
  # Any date on which one of your sprints started. This single value fixes the
  # day sprints start on (its weekday) and, with length_days, every future
  # sprint boundary. Want Monday sprints? Move the anchor to a Monday.
  anchor: 2024-06-06

  # Sprint length in days. The sprint ends on anchor + length_days - 1, so 14
  # gives a Thursday-to-Wednesday fortnight when the anchor is a Thursday.
  length_days: 14

  # Optional cross-check: if set, it must agree with the anchor's weekday.
  # Catches an anchor edit that forgot to move to the intended day.
  start_weekday: thursday

  # Sprint boundaries are evaluated in this timezone, not the runner's UTC.
  timezone: UTC

  # quarter    -> Sprint_Q3_S5_082726_090926  (numbering resets each quarter)
  # continuous -> Sprint_S58_082726_090926    (numbering runs from the anchor)
  numbering: quarter

  # What to call the sprint that starts on the anchor. Use this when adopting
  # the automation part-way through an existing scheme, so numbering carries on
  # instead of restarting at 1.
  #   continuous -> counts up from here forever (23, 24, 25, ...)
  #   quarter    -> labels the anchor's quarter only; later quarters restart at 1
  #
  # Already on Sprint 23, with the next one starting on the anchor? Set:
  #   anchor: <that start date>
  #   numbering: continuous
  #   start_number: 24        -> Sprint_S24_..., then S25, S26
  start_number: 1

  # The month your financial year opens, which is what Q1 is counted from.
  # 1 (January) gives ordinary calendar quarters. A firm whose year opens in
  # April sets 4, and then July -- calendar Q3 -- is reported as Q2.
  fiscal_year_start_month: 1

branches:
  # Sprint branches are cut from here, and back-merge PRs target it.
  base: develop

  # Long-lived environment branches. Each promotion merges into the next.
  dit: env/dit
  sit: env/sit
  uat: env/uat

  sprint_prefix: Sprint
  release_prefix: release/

# Optional. Leave this section out entirely and branch names keep the historical
# format: Sprint_Q3_S5_082726_090926 and release/Q3_S5_082726_090926.
naming:
  # Your board or team code, so a branch is recognisable at a glance instead of
  # looking randomly generated. Each team sets its own.
  project_code: PROTS

  # How the end of the date range is written.
  #   inclusive -> the sprint's own last day        (8/13-8/26)
  #   exclusive -> the next sprint's start date     (8/13-8/27)
  # Most teams write ranges the exclusive way, because the boundary is shared.
  end_boundary: exclusive

  # Fields: quarter, number, year, code, index, start, end
  # Dates take strftime, so {start:%m%d} gives 0813 and {start:%Y-%m-%d} gives
  # 2026-08-13. The result is checked against git's ref rules before use, so a
  # template producing a space or a slash is rejected rather than pushed.
  sprint_template: "Q{quarter}_S{number}_{year}_{code}_{start:%m%d}-{end:%m%d}"
  #   -> Q3_S4_2026_PROTS_0813-0827

  # Same fields, plus {sprint} for the sprint branch name just built.
  release_template: "release/{sprint}"
  #   -> release/Q3_S4_2026_PROTS_0813-0827

promotion:
  # Open the sprint -> DIT pull request automatically on the last day of a sprint.
  auto_open_dit_pr: true

  # Keep `base` current by opening a PR whenever UAT drifts ahead of it.
  # Without this, hotfixes applied downstream are silently lost at the next cut.
  backmerge_to_base: true

  # Requested on every promotion PR. Team or user handles, no @ prefix.
  reviewers: []

  labels:
    - sprint-automation

  draft: false
